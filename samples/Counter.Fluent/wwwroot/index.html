<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mirage Counter (Fluent)</title>
  <style>
    html, body, #app {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    fluent-button {
      border: 1px solid #334155;
      border-radius: 10px;
      background: #e2e8f0;
      color: #0f172a;
      user-select: none;
    }

    fluent-text-field {
      display: block;
      border: 1px solid #94a3b8;
      border-radius: 10px;
      background: #ffffff;
      padding: 4px;
      min-height: 36px;
    }

    fluent-text-field::part(control) {
      font-size: 15px;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="https://unpkg.com/@fluentui/web-components@2.6.1"></script>
  <script type="module" src="main.mjs"></script>
</body>
</html>
