<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mirage Showcase</title>
  <style>
    :root {
      --page-bg: radial-gradient(circle at 14% 6%, #fef3c7 0%, transparent 32%),
        radial-gradient(circle at 87% 4%, #bfdbfe 0%, transparent 38%),
        linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(15, 23, 42, 0.14);
      --ink: #0f172a;
      --muted: #334155;
      --strong: #0b9488;
      --strong-dark: #0b7285;
      --line: rgba(15, 23, 42, 0.24);
      --mono: "IBM Plex Mono", "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      --sans: "IBM Plex Sans", "Avenir Next", "Trebuchet MS", sans-serif;
      --heading: "Space Grotesk", "Avenir Next Condensed", "Gill Sans", sans-serif;
    }

    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--page-bg);
      letter-spacing: 0.01em;
    }

    [data-automation-id="showcase-root"] {
      width: 100%;
      min-height: 100%;
    }

    [data-automation-id="hero-page-stack"] {
      max-width: 1040px;
      margin: 0 auto;
    }

    [data-automation-id="showcase-top-nav"] {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 14px;
      background: rgba(248, 250, 252, 0.75);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 14px;
      z-index: 4;
      flex-wrap: wrap;
    }

    [data-automation-id="showcase-nav-brand"] {
      font-family: var(--heading);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    [data-automation-id="showcase-nav-demo"],
    [data-automation-id="showcase-nav-architecture"],
    [data-automation-id="showcase-nav-providers"] {
      border: 0;
      background: transparent;
      color: var(--strong-dark);
      font-size: 13px;
      padding: 2px 0;
      min-height: 0;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    [data-automation-id="showcase-nav-docs-placeholder"],
    [data-automation-id="showcase-nav-github-placeholder"],
    [data-automation-id="hero-cta-github-placeholder"] {
      color: var(--muted);
      opacity: 0.82;
      font-size: 13px;
    }

    [data-automation-id="hero"],
    [data-automation-id="architecture"],
    [data-automation-id="hero-why-matters"],
    [data-automation-id="hero-cta"],
    [data-automation-id="demo"],
    [data-automation-id="providers"],
    [data-automation-id="showcase-trust-signal"] {
      border: 1px solid var(--card-border);
      border-radius: 20px;
      background: var(--card-bg);
      box-shadow: 0 16px 38px rgba(15, 23, 42, 0.08);
      padding: 22px;
    }

    [data-automation-id="hero-kicker"] {
      font-family: var(--heading);
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--strong-dark);
      font-weight: 700;
    }

    [data-automation-id="hero-headline"] {
      font-family: var(--heading);
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.08;
      font-weight: 700;
      max-width: 15ch;
      letter-spacing: -0.025em;
    }

    [data-automation-id="hero-subheadline"],
    [data-automation-id="hero-description"],
    [data-automation-id="architecture-body"],
    [data-automation-id$="-body"],
    [data-automation-id="hero-why-body"],
    [data-automation-id="hero-why-contrast"] {
      font-size: 1rem;
      line-height: 1.56;
      color: var(--muted);
      max-width: 74ch;
    }

    [data-automation-id="hero-tagline-primary"],
    [data-automation-id="showcase-tagline-secondary"] {
      font-family: var(--heading);
      font-size: 1.02rem;
      color: var(--strong-dark);
      font-weight: 700;
    }

    [data-automation-id="architecture-title"],
    [data-automation-id="hero-why-title"],
    [data-automation-id="demo-title"],
    [data-automation-id="providers-title"] {
      font-family: var(--heading);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    [data-automation-id="architecture-pipeline"] {
      white-space: pre-line;
      font-family: var(--mono);
      font-size: 0.95rem;
      border: 1px dashed var(--line);
      background: rgba(236, 253, 245, 0.8);
      border-radius: 14px;
      padding: 14px;
      color: #0f172a;
    }

    [data-automation-id^="hero-why-bullet-"] {
      font-size: 0.95rem;
      color: #102a43;
      font-weight: 500;
    }

    [data-automation-id="hero-cta-row"] {
      flex-wrap: wrap;
    }

    [data-automation-id="hero-cta-demo"],
    [data-automation-id="hero-cta-architecture"],
    [data-automation-id="showcase-demo-button"] {
      border: 1px solid rgba(11, 114, 133, 0.45);
      border-radius: 12px;
      min-height: 42px;
      padding: 11px 16px;
      background: linear-gradient(145deg, #ecfeff, #ccfbf1);
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
    }

    [data-automation-id="showcase-demo-entry"] {
      width: min(460px, 100%);
      min-height: 44px;
    }

    fast-text-field[data-automation-id="showcase-demo-entry"] {
      border: 1px solid rgba(15, 23, 42, 0.28);
      border-radius: 12px;
      padding: 6px 8px;
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.02);
    }

    fast-text-field[data-automation-id="showcase-demo-entry"] input[data-mirage-value-element="true"] {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font-family: var(--sans);
      font-size: 1rem;
      color: var(--ink);
    }

    [data-automation-id="showcase-demo-your-name-label"],
    [data-automation-id="showcase-demo-greeting"],
    [data-automation-id="showcase-demo-count"],
    [data-automation-id="showcase-demo-powered-by"],
    [data-automation-id="showcase-demo-devtools-hint"],
    [data-automation-id="showcase-runtime-badge"],
    [data-automation-id="showcase-runtime-badge-detail"] {
      line-height: 1.45;
      color: #102a43;
      font-size: 0.97rem;
    }

    [data-automation-id="showcase-demo-devtools-hint"] {
      border-top: 1px dashed var(--line);
      padding-top: 8px;
      color: #0e7490;
      font-weight: 600;
    }

    [data-automation-id="showcase-feature-dom"],
    [data-automation-id="showcase-feature-maui"],
    [data-automation-id="showcase-feature-providers"],
    [data-automation-id="showcase-foundations-lab"] {
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.78);
      padding: 14px;
    }

    [data-automation-id="showcase-foundations-lab-title"] {
      color: #0b7285;
      font-size: 1.05rem;
      font-weight: 700;
    }

    [data-automation-id="foundations-stack-probe"] {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.72);
    }

    [data-automation-id="foundations-horizontal-stack-probe"] {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.72);
      overflow-x: auto;
    }

    [data-automation-id="foundations-grid-probe"] {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.72);
    }

    [data-automation-id^="foundations-grid-cell-"] {
      border: 1px solid rgba(15, 23, 42, 0.14);
      border-radius: 8px;
      padding: 6px 8px;
      background: rgba(248, 250, 252, 0.92);
    }

    [data-automation-id="foundations-bg-solid"],
    [data-automation-id="foundations-bg-linear"],
    [data-automation-id="foundations-size-target"] {
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 12px;
    }

    [data-automation-id$="-title"] {
      font-family: var(--heading);
      font-weight: 700;
    }

    [data-automation-id="showcase-runtime-badge"] {
      font-weight: 700;
      color: #0b7285;
    }

    [data-automation-id="hero-scroll-cue"] {
      text-align: center;
      color: #334155;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding-bottom: 24px;
    }

    @media (max-width: 820px) {
      [data-automation-id="hero-page-stack"] {
        padding-left: 18px !important;
        padding-right: 18px !important;
      }

      [data-automation-id="showcase-top-nav"] {
        top: 8px;
      }

      [data-automation-id="hero-headline"] {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="main.mjs"></script>
</body>
</html>
