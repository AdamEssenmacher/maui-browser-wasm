<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mirage Showcase</title>
  <style>
    :root {
      --page-bg: radial-gradient(circle at 14% 6%, #fef3c7 0%, transparent 32%),
        radial-gradient(circle at 87% 4%, #bfdbfe 0%, transparent 38%),
        linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      --line: rgba(15, 23, 42, 0.24);
    }

    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "IBM Plex Sans", "Avenir Next", "Trebuchet MS", sans-serif;
      color: #0f172a;
      background: var(--page-bg);
      letter-spacing: 0.01em;
    }

    [data-automation-id="showcase-root"] {
      width: 100%;
      min-height: 100%;
    }

    /* Browser-only behavior: sticky nav and text underline affordance. */
    [data-automation-id="showcase-top-nav"] {
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      position: sticky;
      top: 14px;
      z-index: 4;
      flex-wrap: wrap;
    }

    [data-automation-id="showcase-nav-demo"],
    [data-automation-id="showcase-nav-architecture"],
    [data-automation-id="showcase-nav-providers"] {
      padding: 2px 0;
      min-height: 0;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    /* FAST internal input styling remains CSS escape hatch. */
    fast-text-field[data-automation-id="showcase-demo-entry"] {
      border: 1px solid rgba(15, 23, 42, 0.28);
      border-radius: 12px;
      padding: 6px 8px;
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.02);
    }

    fast-text-field[data-automation-id="showcase-demo-entry"] input[data-mirage-value-element="true"] {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font-family: "IBM Plex Sans", "Avenir Next", "Trebuchet MS", sans-serif;
      font-size: 1rem;
      color: #0f172a;
    }

    /* Backlog grid overflow and status chips remain browser-level polish. */
    [data-automation-id="showcase-backlog-table-host"] {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid rgba(15, 23, 42, 0.16);
      background: rgba(255, 255, 255, 0.88);
    }

    [data-automation-id="showcase-backlog-table"] {
      min-width: 980px;
    }

    [data-automation-id^="showcase-backlog-cell-header-"] {
      font-family: "Space Grotesk", "Avenir Next Condensed", "Gill Sans", sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #0f172a;
      background: rgba(15, 23, 42, 0.06);
      border-bottom: 1px solid rgba(15, 23, 42, 0.16);
      padding: 10px 12px;
    }

    [data-automation-id^="showcase-backlog-cell-"]:not([data-automation-id^="showcase-backlog-cell-header-"]):not([data-automation-id*="-status-"]) {
      font-size: 0.9rem;
      line-height: 1.45;
      color: #102a43;
      border-bottom: 1px solid rgba(15, 23, 42, 0.1);
      padding: 10px 12px;
    }

    @media (max-width: 820px) {
      [data-automation-id="showcase-top-nav"] {
        top: 8px;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="main.mjs"></script>
</body>
</html>
