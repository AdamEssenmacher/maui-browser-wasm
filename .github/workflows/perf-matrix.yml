name: Performance Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  perf-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.102

      - name: Install workloads (Linux)
        if: runner.os == 'Linux'
        run: dotnet workload install wasm-tools

      - name: Install workloads (non-Linux)
        if: runner.os != 'Linux'
        run: dotnet workload install maui wasm-tools

      - name: Restore
        run: dotnet restore Mirage.sln

      - name: Build
        run: dotnet build Mirage.sln --configuration Release --no-restore

      - name: Install Playwright browser
        run: |
          pwsh tests/Mirage.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Performance budget matrix
        run: |
          mkdir -p "${{ github.workspace }}/artifacts/perf-matrix"
          MIRAGE_MATRIX_RUNS=2 \
          MIRAGE_MATRIX_CONFIGURATION=Release \
          MIRAGE_MATRIX_OUTPUT_DIR="${{ github.workspace }}/artifacts/perf-matrix" \
          MIRAGE_PERF_BUDGET_FILE="tools/diagnostics/perf-budgets-balanced.cfg" \
          tools/diagnostics/run-slowness-matrix.sh

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirage-perf-matrix
          path: ${{ github.workspace }}/artifacts/perf-matrix
