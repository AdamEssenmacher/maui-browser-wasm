name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install workloads
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore MauiDomWasm.sln

      - name: Build
        run: dotnet build MauiDomWasm.sln --configuration Release --no-restore

      - name: Build Debug sample for hot reload check
        run: dotnet build src/Maui.Browser.Sample/Maui.Browser.Sample.csproj --configuration Debug

      - name: Hot reload prerequisites
        run: ./scripts/check-hotreload-prereqs.sh

      - name: Install Playwright browser
        run: |
          pwsh tests/Maui.Browser.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E smoke
        run: dotnet test tests/Maui.Browser.E2E.Tests/Maui.Browser.E2E.Tests.csproj --configuration Release --no-build
