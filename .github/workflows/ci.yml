name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.102

      - name: Install workloads (Linux)
        if: runner.os == 'Linux'
        run: dotnet workload install wasm-tools

      - name: Install workloads (non-Linux)
        if: runner.os != 'Linux'
        run: dotnet workload install maui wasm-tools

      - name: Restore
        run: dotnet restore Mirage.CI.slnf

      - name: Build
        run: dotnet build Mirage.CI.slnf --configuration Release --no-restore

      - name: Install Playwright browser
        run: |
          pwsh tests/Mirage.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Core tests
        run: dotnet test tests/Mirage.Core.Tests/Mirage.Core.Tests.csproj --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/Mirage.Integration.Tests/Mirage.Integration.Tests.csproj --configuration Release --no-build

      - name: E2E tests
        run: dotnet test tests/Mirage.E2E.Tests/Mirage.E2E.Tests.csproj --configuration Release --no-build
