name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install workloads
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore MauiDomWasm.sln

      - name: Build
        run: dotnet build MauiDomWasm.sln --configuration Release --no-restore
